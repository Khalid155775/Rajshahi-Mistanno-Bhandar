<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Rajshahi Mistanno Bhandar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-gradient-to-r from-[#008cb4] via-[#76b852] to-[#e4b025] min-h-screen text-white">
    <div class="min-h-screen px-4 py-8 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-6xl">
            <div class="text-center">
                <h1 class="text-2xl font-black tracking-tight text-white sm:text-3xl">Rajshahi Mistanno Bhandar</h1>
                <p class="mt-2 text-sm uppercase tracking-[0.35em] text-amber-200">Professional Admin Panel</p>
            </div>

            <div id="login-gate-box" class="mx-auto mt-10 max-w-sm rounded-2xl border border-white/10 bg-zinc-900/90 p-6 shadow-2xl backdrop-blur-md">
                <p class="text-sm text-amber-300">🔐 Rajshahi Mistanno Bhandar - Admin Gate</p>
                <div id="admin-login-form" class="mt-6 space-y-4">
                    <div>
                        <label for="admin-password-input" class="block text-xs uppercase tracking-[0.35em] text-slate-400">Admin Password</label>
                        <input id="admin-password-input" type="password" autocomplete="current-password" class="mt-2 w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-slate-500 focus:border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300/20" placeholder="Enter password" />
                    </div>
                    <button type="button" onclick="checkAdminPassword()" class="w-full rounded-2xl bg-gradient-to-r from-amber-400 via-amber-300 to-amber-200 px-5 py-3 text-sm font-semibold text-zinc-950 shadow-lg shadow-amber-500/20 transition hover:opacity-95">Unlock Dashboard</button>
                </div>
            </div>

            <section id="admin-dashboard" class="hidden rounded-3xl border border-white/10 bg-zinc-900/90 p-6 shadow-2xl shadow-black/30 backdrop-blur-xl mt-10">
                <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                    <div>
                        <h2 class="text-xl font-black text-white">Management Dashboard</h2>
                        <p class="mt-2 text-sm text-slate-300">Update sweets inventory and manage the live storefront instantly.</p>
                    </div>
                </div>

                <div class="grid gap-6 lg:grid-cols-[1.2fr_0.8fr]">
                    <div class="rounded-3xl border border-white/10 bg-white/5 p-6 shadow-xl shadow-black/20">
                        <h3 class="text-lg font-semibold text-white">Add New Sweet</h3>
                        <div class="mt-5 space-y-4">
                            <div>
                                <label class="block text-sm uppercase tracking-[0.28em] text-slate-400">Sweet Name</label>
                                <input id="sweet-name" type="text" class="mt-2 w-full rounded-2xl border border-white/10 bg-zinc-950/70 px-4 py-3 text-white placeholder:text-slate-500 focus:border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300/20" placeholder="e.g. রাজভোগ" />
                            </div>
                            <div>
                                <label class="block text-sm uppercase tracking-[0.28em] text-slate-400">Price per kg</label>
                                <input id="sweet-price" type="number" class="mt-2 w-full rounded-2xl border border-white/10 bg-zinc-950/70 px-4 py-3 text-white placeholder:text-slate-500 focus:border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300/20" placeholder="e.g. 320" min="1" />
                            </div>
                            <div>
                                <label class="block text-sm uppercase tracking-[0.28em] text-slate-400">Description</label>
                                <textarea id="sweet-desc" rows="4" class="mt-2 w-full rounded-2xl border border-white/10 bg-zinc-950/70 px-4 py-3 text-white placeholder:text-slate-500 focus:border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300/20" placeholder="Add product details..."></textarea>
                            </div>
                            <div>
                                <label class="block text-sm uppercase tracking-[0.28em] text-slate-400">Image File</label>
                                <input type="file" id="sweet-img-file" class="w-full bg-zinc-900 border border-white/10 rounded-xl p-2.5 text-xs text-white" accept="image/*">
                            </div>
                            <button type="button" onclick="addNewSweetFromForm()" class="mt-2 w-full rounded-2xl bg-gradient-to-r from-amber-400 via-amber-300 to-amber-200 px-5 py-3 text-sm font-semibold text-zinc-950 shadow-lg shadow-amber-500/20 transition hover:opacity-95">নতুন মিষ্টি যুক্ত করুন</button>
                        </div>
                    </div>

                    <div class="rounded-3xl border border-white/10 bg-white/5 p-6 shadow-xl shadow-black/20">
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg font-semibold text-white">Live Inventory</h3>
                            <span class="rounded-full bg-amber-400/10 px-3 py-1 text-xs font-semibold text-amber-300">Real-time sync</span>
                        </div>
                        <div id="admin-table-container" class="mt-5 space-y-4"></div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
